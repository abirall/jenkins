services:
  homer:
    image: b4bz/homer:latest
    restart: unless-stopped
    container_name: homer

    ports:
      - "3000:8080"

    volumes:
      - ../homer/assets:/www/assets
      - ../homer/logo.svg:/www/logo.svg

    environment:
      UID: "1000"
      GID: "1000"

    networks:
      - dev

networks:
  dev:
