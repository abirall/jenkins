services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/apps:/etc/nginx/conf.d/apps:ro
      - ./nginx/utils:/etc/nginx/conf.d/utils:ro
    command: [ nginx-debug, '-g', 'daemon off;' ]
    depends_on:
      - homer
      - jenkins

    networks:
      - dev

  homer:
    image: b4bz/homer:latest
    restart: unless-stopped
    container_name: homer

    volumes:
      - ./homer/assets:/www/assets
      - ./homer/logo.svg:/www/logo.svg

    environment:
      - UID=1000
      - GID=1000

    networks:
      - dev

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    hostname: jenkins.local
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/jenkins/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    ports:
      - "${JENKINS_AGENT_PORT:-50000:50000}"
      - "${JENKINS_PORT-8081}:8080"

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      NB_SETUP_KEY: "${NB_SETUP_KEY}"
      NB_MANAGEMENT_URL: "${NB_MANAGEMENT_URL}"

      JENKINS_HOME: "${JENKINS_HOME:-/var/jenkins_home}"
      JENKINS_OPTS: "${JENKINS_OPTS:---prefix=/jenkins}"
      JENKINS_URL: "${JENKINS_URL:-${ROOT_URL}/jenkins}"

      CASC_JENKINS_CONFIG: "${JENKINS_HOME:-/var/jenkins_home}/casc_configs"
      DOCKER_STACK_DIR: "${DOCKER_STACK_DIR:-/opt/stacks}"

    volumes:
      - jenkins-home:${JENKINS_HOME:-/var/jenkins_home}
      - ./casc:${JENKINS_HOME:-/var/jenkins_home}/casc_configs

      - /var/run/docker.sock:/var/run/docker.sock

      # - "${JENKINS_AWS_CREDENTIALS:-./.aws}:${JENKINS_HOME:-/var/jenkins_home}/.aws:ro"

    networks:
      - dev
volumes:
  jenkins-home:

networks:
  dev:
  db:
