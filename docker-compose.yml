name: logicandcrayons

services:

  jenkins:
    build:
      context: jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    hostname: jenkins.local
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/jenkins/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    ports:
      - "8080:8080"

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

    volumes:
      - jenkins-home:/var/jenkins_home

      - ./casc:/var/jenkins_home/casc

      - ./jobs:/var/jenkins_home/jobs

      - ./homar:/opt/stacks/homar

      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - dev

networks:
  dev:
