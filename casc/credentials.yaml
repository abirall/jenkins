credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "slack-token"
              description: "Slack bot token"
              secret: "${readFile:/run/secrets/slack-token}"
          - string:
              scope: GLOBAL
              id: "docker-password"
              description: "Docker registry password"
              secret: "${readFile:/run/secrets/docker-password}"