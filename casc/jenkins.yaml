jenkins:
  systemMessage: "Welcome to Jenkins"
  numExecutors: 2

unclassified:
  location:
    url: "${JENKINS_URL}"

  buildDiscarders:
    configuredBuildDiscarders:
      - "jobBuildDiscarder"
      - simpleBuildDiscarder:
          discarder:
            logRotator:
              numToKeepStr: "10"