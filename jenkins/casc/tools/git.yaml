tool:
  git:
    installations:
      - name: "git-windows"
        home: "git"
        properties:
          - installSource:
              installers:
                - zip:
                    label: "windows"
                    subdir: "mingw64\\bin\\git.exe"
                    url: "https://github.com/git-for-windows/git/releases/download/v2.54.0.windows.1/MinGit-2.54.0-64-bit.zip"
