jenkins:
  systemMessage: "test" 

  securityRealm: 
    local: 
      allowsSignup: false 
      users: 
        - id: "abir"
          password: "admin123"

        - id: "abirdev" 
          password: "dev123"

  authorizationStrategy:
    roleBased:
      roles:
        global:
        - name: "abir"
          pattern: ".*"
          entries:
          - user: "admin"
          permissions:
          - "Overall/Administer"
        - name: "abirdev"
          pattern: ".*"
          entries:
          - user: "abirdev"
          permissions:
          - "Job/Cancel"
          - "Overall/Read"
          - "Job/Build"
          - "Run/Update"
          - "Job/Read"
          - "Job/Workspace"
          - "View/Read"
          - "Run/Replay"
  numExecutors: 2

  projectNamingStrategy:
      roleBased:
        forceExistingJobs: true

