jenkins:
  systemMessage: "Welcome to Jenkins"

  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "abir"
          password: "admin123"

        - id: "abirdev"
          password: "dev123"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Jenkins Administrator"
            entries:
              - user: "abir"
            permissions:
              - "Overall/Administer"

          - name: "developer"
            description: "Developer Access"
            entries:
              - user: "abirdev"
            permissions:
              - "Overall/Read"
              - "View/Read"
              - "Job/Read"
              - "Job/Discover"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Run/Replay"
              - "Run/Update"

  projectNamingStrategy:
    roleBased:
      forceExistingJobs: true

