jenkins:
  nodes:
    - permanent:
        name: "windows-parallels"
        remoteFS: "C:\\Jenkins"
        numExecutors: 2
        labelString: "windows dotnet"
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound:
            webSocket: false
            workDirSettings:
              disabled: false
              internalDir: "remoting"
              failIfWorkDirIsMissing: false
              workDirPath: "C:\\Jenkins"

