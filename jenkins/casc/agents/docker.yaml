jenkins:
  clouds:
    - docker:
        name: "docker"
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"

        containerCap: 2

        templates:
          - labelString: "docker linux"
            name: "docker-agent"
            remoteFs: "/home/jenkins/agent"
            instanceCapStr: "2"
            mode: NORMAL

            retentionStrategy:
              idleMinutes: 5

            pullStrategy: PULL_LATEST
            removeVolumes: true

            dockerTemplateBase:
              image: "jenkins/inbound-agent:latest"
              tty: true

              mountsString: |
                type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock
                type=bind,src=${DOCKER_STACK_DIR},dst=/opt/stacks

            connector:
              attach:
                user: "jenkins"
