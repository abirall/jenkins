jenkins:
  nodes:
    - permanent:
        name: "mac-parallels"
        remoteFS: "/home/jenkins-agent"
        numExecutors: 2
        labelString: "macOS"
        mode: EXCLUSIVE
        retentionStrategy: "always"
        launcher:
          inbound:
            webSocket: false
            workDirSettings:
              disabled: false
              internalDir: "remoting"
              failIfWorkDirIsMissing: false
              workDirPath: "/home/jenkins/agent"
